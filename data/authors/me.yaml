bio: |
    I'm a PhD candidate in Intelligent Systems at the University of Pittsburgh.
    My research sits at the intersection of fairness, interpretability,
    and causal reasoning in machine learning. I focus on bias mitigation in clinical
    decision-making, working with models that are not just accurate,    
    but also transparent in high-impact applications such as healthcare.

